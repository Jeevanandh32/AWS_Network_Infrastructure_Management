global:
  scrape_interval: 10s
  scrape_timeout: 8s

scrape_configs:
  - job_name: http-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
      target: ["http://lab-http:80/"]
    static_configs:
      - targets: ["client:9115"]
        labels:
          monitored_service: lab-http
